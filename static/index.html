<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="お部屋">
  <title>お部屋のリモコン</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="greet" id="greet">こんにちは</p>
        <h1>お部屋</h1>
      </div>
      <div class="conn" id="conn" title="接続状態"><span class="dot"></span><span id="conn-label">接続中…</span></div>
    </header>

    <section class="scenes" id="scenes" aria-label="シーン"></section>
    <div id="devices"></div>

    <p class="note">状態表示は「最後に送った操作」です。リモコン本体で操作した分は反映されません。</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/main.js"></script>
</body>
</html>
