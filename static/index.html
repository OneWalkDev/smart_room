<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2128" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e4e7ec" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="お部屋">
  <title>お部屋のリモコン</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1 class="title">お部屋</h1>
    <p class="hint">表示は最後に送った操作です。リモコン本体での操作は反映されません。</p>
  </header>

  <main class="faces" id="devices" aria-label="機器"></main>

  <footer class="dock" id="dock">
    <div class="window" id="window" data-mode="idle">
      <span class="lamp" aria-hidden="true"></span>
      <p class="readout" id="readout" role="status" aria-live="polite">読み込み中…</p>
      <p class="readout readout-err" id="alert" role="alert"></p>
    </div>
    <nav class="scenes" id="scenes" aria-label="シーン"></nav>
  </footer>

  <script src="/static/main.js"></script>
</body>
</html>
