# SmartRoom 設定
# ボタンを増やすときはここに追記するだけでOK（UIは自動で反映されます）。
# code は codes.json（irrp.py で学習したファイル）のキー名です。

gpio: 22              # 赤外線LEDをつないだ GPIO (BCM)
carrier_khz: 38.0     # 搬送波周波数
gap_ms: 100           # 連続送信時の間隔

devices:
  light:
    label: 電気
    icon: bulb
    groups:
      - layout: tiles
        commands:
          off:   { label: 消灯,   code: "power:off",  icon: power }
          night: { label: 常夜灯, code: "power:half", icon: moon }
          full:  { label: 全灯,   code: "power:on",   icon: sun }
      - layout: stepper
        commands:
          down: { label: 暗く,   code: "light:down", icon: minus }
          up:   { label: 明るく, code: "light:up",   icon: plus }
      - layout: chips
        commands:
          p30: { label: "30%", code: "light:30" }
          p60: { label: "60%", code: "light:60" }
          p80: { label: "80%", code: "light:80" }

  air:
    label: エアコン
    icon: fan
    # エアコンのリモコンは「モード+温度+運転」をまとめて送るので、よく使う設定をプリセットとして学習する
    groups:
      - layout: tiles
        commands:
          off: { label: 停止, code: "air:off", icon: power }
          dry: { label: 除湿, code: "air:dry", icon: droplet }
      - layout: tiles
        commands:
          cool22: { label: 冷房 22℃, code: "air:cool22", icon: snow }
          cool26: { label: 冷房 26℃, code: "air:cool26", icon: snow }
      - layout: tiles
        commands:
          heat22: { label: 暖房 22℃, code: "air:heat22", icon: flame }
          heat26: { label: 暖房 26℃, code: "air:heat26", icon: flame }

scenes:
  all_on:
    label: ただいま
    icon: home
    steps: [light.p30, air.heat26]   # 夏は air.cool26 などに
  all_off:
    label: おやすみ
    icon: moon
    steps: [light.off, air.off]
